name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK (skip native if NDK missing)
        run: |
          ./gradlew assembleDebug --stacktrace -x externalNativeBuildDebug -x externalNativeBuildCleanDebug || \
          ./gradlew assembleDebug --stacktrace

      - name: List outputs
        if: always()
        run: |
          find app/build/outputs -type f -name "*.apk" -o -name "*.aab" 2>/dev/null || true
          ls -laR app/build/outputs/apk 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plamo-translate-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
